name: Build Windows Desktop EXE (E-Arsip Al-Hikam)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Windows EXE Installer & Portable
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Package Windows Desktop App (.exe)
        run: npx --yes electron-builder --win --x64 -c.publish=never

      - name: Upload Windows EXE Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: E-Arsip-Al-Hikam-Windows-Desktop-EXE
          path: dist-electron/*.exe
          if-no-files-found: warn
